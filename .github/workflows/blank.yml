name: 24/7 Minecraft AFK Bot

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */4 * * *' # Automatically restarts every 4 hours to keep it alive
  workflow_dispatch: # Allows you to start it manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        npm install mineflayer
        pip install javascript

    - name: Run Minecraft Bot
      run: python bot.py
