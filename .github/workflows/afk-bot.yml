name: 24/7 Minecraft AFK Bot

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */4 * * *'   # restart every 4 hours
  workflow_dispatch:        # manual start button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # max allowed on free runners is 6 hours

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        npm install mineflayer
        pip install javascript

    - name: Run Minecraft Bot
      env:
        # Optional: if you later switch to token / password auth
        # MS_EMAIL: ${{ secrets.MS_EMAIL }}
        # MS_PASSWORD: ${{ secrets.MS_PASSWORD }}
      run: python bot.py